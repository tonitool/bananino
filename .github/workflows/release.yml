name: Release

# Building the app needs macOS: the capture helper is Swift compiled by swiftc, the app
# bundle is signed ad-hoc by codesign, and the DMG is made by hdiutil. So a release is cut
# on a macOS runner rather than from whichever machine happens to be to hand.
#
# Two ways in. Pushing a v* tag releases that tag. Running the workflow by hand releases
# only if asked, and then takes its version from package.json and makes the tag here —
# which means a release can be cut by someone who can run a workflow but cannot push a
# tag, and that the version in the repository is what decides what ships. Asked for
# nothing, a manual run just builds and leaves the app as the run's artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Cut a release for the version in package.json
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  macos:
    # arm64, matching the only target the app builds for.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # One step decides what this run is, so every step below agrees about it.
      #
      # electron-builder publishes to the release for the version in package.json, not to
      # whatever triggered the run. On a tag push those can disagree — the tag says one
      # thing and the download says another — so a mismatch stops the run here.
      - name: Decide what this run is
        id: run
        run: |
          version="$(node -p 'require("./package.json").version')"

          if [ "${{ github.event_name }}" = 'push' ]; then
            tag="$GITHUB_REF_NAME"
            if [ "${tag#v}" != "$version" ]; then
              echo "tag $tag does not match package.json $version"
              exit 1
            fi
            releasing=true
          elif [ "${{ inputs.release }}" = 'true' ]; then
            tag="v$version"
            releasing=true
          else
            tag=''
            releasing=false
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "releasing=$releasing" >> "$GITHUB_OUTPUT"
          echo "cutting ${tag:-nothing} (releasing: $releasing)"

      # A manual release has no tag of its own, so it makes one before anything is built.
      # Refusing a tag that already exists is what stops a second run quietly re-cutting a
      # version that has already shipped.
      - name: Tag this commit
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.run.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists — bump the version in package.json to cut a new one"
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"

      - run: npm ci

      - run: npm test

      # The optimised models are generated, not committed — see .gitignore.
      - name: Generate the character models
        run: npm run optimise-model

      # Not releasing: this leaves the app in the run's artifact and touches nothing
      # public, so a manual run can check a build without littering drafts.
      - name: Build and package
        if: steps.run.outputs.releasing != 'true'
        run: npm run dist

      # Uploads into a *draft* release — see build.publish in package.json. Publishing
      # straight to a live release is what broke 1.1.0: electron-builder runs one publisher
      # per artifact, they each try to create the release, and once one has, the rest get
      # back "422 Published releases must have a valid tag" from GitHub. The winner had
      # uploaded a single blockmap by then, so the release went out with no app in it.
      - name: Build, package and upload to the draft release
        if: steps.run.outputs.releasing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      # electron-builder drops some extensions by default, which once shipped an app with
      # a missing prop while the dev build looked perfect. The characters go the same way.
      - name: Check every build asset reached the app bundle
        run: npm run verify:assets

      # The check that would have caught 1.1.0: a release nobody can download from is
      # worse than no release, and an empty one looks exactly like a good one from here.
      - name: Check the draft actually carries the app
        if: steps.run.outputs.releasing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.run.outputs.tag }}
        run: |
          names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$names"
          for want in '\.dmg$' '\.zip$' '^latest-mac\.yml$'; do
            echo "$names" | grep -qE "$want" || { echo "the draft has no $want asset"; exit 1; }
          done

      # Published last, and only once the build is known to be complete, so a failed run
      # leaves a draft to inspect rather than a broken download in front of users.
      #
      # --latest is explicit on purpose: the app's update notifier reads
      # /releases/latest (src/main/update/notifier.js), and GitHub would otherwise pick by
      # the draft's creation date, which is not necessarily this one.
      - name: Publish the release
        if: steps.run.outputs.releasing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.run.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest

      # Kept for a release that fails to publish, and for runs that only build.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bananino-mac-arm64
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: warn
