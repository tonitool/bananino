name: Release

# Building the app needs macOS: the capture helper is Swift compiled by swiftc, the app
# bundle is signed ad-hoc by codesign, and the DMG is made by hdiutil. So a release is cut
# on a macOS runner rather than from whichever machine happens to be to hand.
#
# Three ways in, because whoever cuts a release rarely holds every permission for it.
#
#   - push a v* tag             releases that tag, checked against package.json
#   - push a release/v* branch  releases package.json's version, tags it here, and deletes
#                               the branch again; it exists only to start this
#   - run it by hand            releases package.json's version unless told to only build
#
# The middle one looks redundant until you need it: pushing a tag and dispatching a
# workflow are separately privileged, and an automation that can do neither can still push
# a branch. All three end in the same place — the version in package.json decides what
# ships, and a version that already has a tag is refused rather than quietly re-cut.
on:
  push:
    tags: ['v*']
    branches: ['release/v*']
  workflow_dispatch:
    inputs:
      release:
        # Ticked by default, because this workflow is called Release and a run of it that
        # quietly does not release is a wasted trip — which is exactly what happened the
        # first time it was offered as an unticked box. Untick it to only build.
        #
        # What stops that default doing damage is the tag check below: a version that has
        # already shipped is refused rather than re-cut.
        description: Cut a release for the version in package.json (untick to only build)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  macos:
    # arm64, matching the only target the app builds for.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # One step decides what this run is, so every step below agrees about it.
      #
      # electron-builder publishes to the release for the version in package.json, not to
      # whatever triggered the run. On a tag push those can disagree — the tag says one
      # thing and the download says another — so a mismatch stops the run here.
      - name: Decide what this run is
        id: run
        run: |
          version="$(node -p 'require("./package.json").version')"

          case "${{ github.event_name }}:$GITHUB_REF_TYPE" in
            push:tag)
              # The tag names the version, so it had better be the version: electron-builder
              # publishes to package.json's release regardless of what triggered the run, and
              # a disagreement means the tag says one thing and the download says another.
              tag="$GITHUB_REF_NAME"
              if [ "${tag#v}" != "$version" ]; then
                echo "tag $tag does not match package.json $version"
                exit 1
              fi
              releasing=true
              ;;
            push:branch)
              tag="v$version"
              releasing=true
              ;;
            *)
              if [ "${{ inputs.release }}" = 'true' ]; then
                tag="v$version"
                releasing=true
              else
                tag=''
                releasing=false
              fi
              ;;
          esac

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "releasing=$releasing" >> "$GITHUB_OUTPUT"

          # On the run's summary page, not just buried in a log: a run that built without
          # releasing looked identical to one that released, right down to the green tick.
          if [ "$releasing" = 'true' ]; then
            echo "Cutting **$tag**." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Building **$version** only — no release. Tick \`release\` to cut one." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # Only a tag push arrives with a tag; the other two make one before anything is
      # built. Refusing a tag that already exists is what stops a second run quietly
      # re-cutting a version that has already shipped.
      - name: Tag this commit
        if: steps.run.outputs.releasing == 'true' && github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.run.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists — bump the version in package.json to cut a new one"
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"

      # Deleted as soon as it has been read, so the repository does not accumulate a branch
      # per release. The tag is the record; this was only a doorbell.
      - name: Drop the trigger branch
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME" \
            || echo "could not delete $GITHUB_REF_NAME — harmless, but tidy it up by hand"

      - run: npm ci

      - run: npm test

      # The optimised models are generated, not committed — see .gitignore.
      - name: Generate the character models
        run: npm run optimise-model

      # Not releasing: this leaves the app in the run's artifact and touches nothing
      # public, so a manual run can check a build without littering drafts.
      - name: Build and package
        if: steps.run.outputs.releasing != 'true'
        run: npm run dist

      # Uploads into a *draft* release — see build.publish in package.json. Publishing
      # straight to a live release is what broke 1.1.0: electron-builder runs one publisher
      # per artifact, they each try to create the release, and once one has, the rest get
      # back "422 Published releases must have a valid tag" from GitHub. The winner had
      # uploaded a single blockmap by then, so the release went out with no app in it.
      - name: Build, package and upload to the draft release
        if: steps.run.outputs.releasing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      # electron-builder drops some extensions by default, which once shipped an app with
      # a missing prop while the dev build looked perfect. The characters go the same way.
      - name: Check every build asset reached the app bundle
        run: npm run verify:assets

      # The check that would have caught 1.1.0: a release nobody can download from is
      # worse than no release, and an empty one looks exactly like a good one from here.
      #
      # The .dmg and the .zip are what a person downloads, so their absence fails the run.
      # latest-mac.yml is only noted: nothing here consumes it, because the app checks for
      # updates by reading /releases/latest and pointing at the page rather than through
      # Squirrel — see src/main/update/notifier.js. Failing a good release over a file the
      # app never reads would be the same mistake in the other direction.
      - name: Check the draft actually carries the app
        if: steps.run.outputs.releasing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.run.outputs.tag }}
        run: |
          names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$names"
          for want in '\.dmg$' '\.zip$'; do
            echo "$names" | grep -qE "$want" || { echo "the draft has no $want asset"; exit 1; }
          done
          echo "$names" | grep -qE '^latest-mac\.yml$' || echo "note: no latest-mac.yml"

      # Published last, and only once the build is known to be complete, so a failed run
      # leaves a draft to inspect rather than a broken download in front of users.
      #
      # --latest is explicit on purpose: the app's update notifier reads
      # /releases/latest (src/main/update/notifier.js), and GitHub would otherwise pick by
      # the draft's creation date, which is not necessarily this one.
      - name: Publish the release
        if: steps.run.outputs.releasing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.run.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest

      # Kept for a release that fails to publish, and for runs that only build.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bananino-mac-arm64
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: warn
